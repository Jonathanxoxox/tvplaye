name: Flutlicht Bildschirm-Tour

# Richtet die App im Emulator (1920×1080, Deutsch) mit einer Test-Playlist ein, läuft per
# Fernbedienungstasten durch Menüs, TV-Guide, Player und Einstellungen und legt die Fotos im Zweig
# screens/<Arbeitszweig> ab. So lassen sich Darstellungsfehler ohne Fernseher prüfen.
on:
  push:
    branches: [ "claude/project-thread-xpoaz5" ]
  workflow_dispatch:
    inputs:
      parts:
        description: "Teile der Tour (all oder z. B. vod,player)"
        default: all

permissions:
  contents: write

concurrency:
  group: screens-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tour:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build x86_64 APK
        env:
          KEYSTORE_PASSWORD: android
          KEY_ALIAS: sideload
          KEY_PASSWORD: android
        run: |
          KS="$RUNNER_TEMP/release.keystore"
          keytool -genkeypair -keystore "$KS" -storepass android -keypass android -alias sideload \
            -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Flutlicht"
          export KEYSTORE_FILE="$KS"
          chmod +x ./gradlew
          ./gradlew assembleX86_64Release --stacktrace
          mkdir -p dist
          cp "$(ls app/build/outputs/apk/x86_64/release/*.apk | head -n1)" dist/app.apk

      - name: Test playlist, guide and stream
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          pip install -q pillow
          python3 tools/smoke/fixtures.py fx
          mkdir -p fx/stream
          ffmpeg -loglevel error -f lavfi -i testsrc2=size=1280x720:rate=25 -f lavfi -i sine=frequency=440 \
            -t 120 -c:v libx264 -preset veryfast -pix_fmt yuv420p -c:a aac -f hls -hls_time 4 \
            -hls_list_size 0 fx/stream/index.m3u8
          nohup python3 -m http.server 8080 --directory fx > http.log 2>&1 &

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Tour on emulator
        env:
          TOUR_PARTS: ${{ inputs.parts || 'all' }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          profile: tv_1080p
          disable-animations: true
          script: bash tools/smoke/screens.sh

      - name: Publish screenshots
        if: always()
        env:
          BRANCH: screens/${{ github.ref_name }}
        run: |
          [ -d tour ] || exit 0
          python3 - <<'PY'
          import glob, os
          from PIL import Image
          for p in sorted(glob.glob("tour/*.png")):
              try:
                  Image.open(p).convert("RGB").save(p[:-4] + ".jpg", quality=82)
              except Exception as e:
                  print(p, e)
              os.remove(p)
          PY
          cp http.log tour/ 2>/dev/null || true
          cd tour
          git init -q -b screens
          git config user.name "flutlicht-ci"; git config user.email "ci@users.noreply.github.com"
          echo "Lauf ${{ github.run_id }} · ${{ github.sha }}" > README.md
          git add -A && git commit -q -m "Bildschirm-Tour ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:refs/heads/$BRANCH
