name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build APK
        run: |
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk TVKanaele.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TVKanaele
          path: TVKanaele.apk

      # Immer die neueste APK unter einer festen Adresse, damit man sie am Fernseher
      # direkt (z. B. mit der App "Downloader") laden kann.
      - name: Publish "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Neueste Version
          prerelease: true
          make_latest: false
          body: "Automatisch gebaut aus ${{ github.ref_name }} @ ${{ github.sha }}"
          files: TVKanaele.apk
