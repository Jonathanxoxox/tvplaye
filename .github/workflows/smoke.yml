name: Flutlicht Starttest

# Startet die App auf einem Emulator und schreibt Absturzmeldungen ins Log, damit ein Fehler beim
# Start ohne Fernseher sichtbar wird.
on:
  push:
    branches: [ "claude/**" ]
  workflow_dispatch:

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build x86_64 APK
        env:
          KEYSTORE_PASSWORD: android
          KEY_ALIAS: sideload
          KEY_PASSWORD: android
        run: |
          KS="$RUNNER_TEMP/release.keystore"
          keytool -genkeypair -keystore "$KS" -storepass android -keypass android -alias sideload \
            -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Flutlicht"
          export KEYSTORE_FILE="$KS"
          chmod +x ./gradlew
          ./gradlew assembleX86_64Release --stacktrace
          mkdir -p dist
          cp "$(ls app/build/outputs/apk/x86_64/release/*.apk | head -n1)" dist/app.apk

      - name: List OwnTV strings
        run: |
          for f in $(find app/build/intermediates -path "*merged.dir*" \( -name values.xml -o -name values-de.xml \)); do
            echo "===== $f"
            python3 - "$f" <<'PY'
          import sys, re, xml.etree.ElementTree as ET
          for e in ET.parse(sys.argv[1]).getroot():
              if e.tag in ("string", "plurals"):
                  text = "".join(e.itertext())
                  if re.search(r"own\s?tv", text, re.I):
                      print("STR", e.get("name"), "=", text.replace("\n", " ")[:200])
          PY
          done

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install -r dist/app.apk
            adb logcat -c
            adb shell monkey -p io.github.jonathanxoxox.tvplayer -c android.intent.category.LAUNCHER 1
            sleep 25
            echo "===== RESUMED ====="; adb shell dumpsys activity activities | grep -i "ResumedActivity" || true
            echo "===== CRASH ====="; adb logcat -d -b crash || true
            echo "===== ERRORS ====="; adb logcat -d '*:E' | tail -n 200 || true
            if adb logcat -d -b crash | grep -q "Process: io.github.jonathanxoxox.tvplayer"; then echo "::error::Die App stürzt beim Start ab"; exit 1; fi
