name: Flutlicht APK

# Baut bei jedem Push auf den Arbeitszweig eine signierte Release-APK und legt sie unter einer
# festen Adresse im Release "latest" ab, damit man sie am Fernseher direkt laden kann.
on:
  push:
    branches: [ "claude/**" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tvplayer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Das Android-SDK ist auf ubuntu-latest vorinstalliert; fehlende Plattformen lädt Gradle nach.
      - uses: gradle/actions/setup-gradle@v4

      # Signiert wird mit dem Schlüssel aus dem Secret KEYSTORE_BASE64, damit jede neue APK sich über
      # die alte installiert. Fehlt das Secret, entsteht ein einmaliger Schlüssel nur für diesen Lauf.
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          KS="$RUNNER_TEMP/release.keystore"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$KS"
          else
            echo "::warning::Secret KEYSTORE_BASE64 fehlt, diese APK bekommt einen einmaligen Schlüssel."
            keytool -genkeypair -keystore "$KS" -storepass android -keypass android -alias sideload \
              -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Flutlicht"
          fi
          echo "KEYSTORE_FILE=$KS" >> "$GITHUB_ENV"

      - name: Build APK
        env:
          VERSION_NAME: 1.0.${{ github.run_number }}
          KEYSTORE_PASSWORD: android
          KEY_ALIAS: sideload
          KEY_PASSWORD: android
        run: |
          export VERSION_CODE=$((10000 + GITHUB_RUN_NUMBER))
          chmod +x ./gradlew
          ./gradlew assembleStandardRelease --stacktrace
          mkdir -p dist
          cp "$(ls app/build/outputs/apk/standard/release/*.apk | head -n1)" dist/Flutlicht.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Flutlicht
          path: dist/Flutlicht.apk
          if-no-files-found: error

      - name: Publish "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Neueste Version
          prerelease: true
          make_latest: false
          body: "Automatisch gebaut aus ${{ github.ref_name }} @ ${{ github.sha }} (Version 1.0.${{ github.run_number }})"
          files: dist/Flutlicht.apk
