name: Flutlicht APK

# Baut bei jedem Push auf main oder einen Arbeitszweig eine signierte Release-APK. Sie landet zweimal
# in den Releases: unter der festen Adresse im Release "latest" (zum Laden am Fernseher) und als
# Release v1.0.<Lauf>, das der Updater in der App findet (er fragt GitHubs neuestes Release ab und
# vergleicht dessen Tag mit der installierten Version).
on:
  push:
    branches: [ "main", "claude/**" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tvplayer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # Das Android-SDK ist auf ubuntu-latest vorinstalliert; fehlende Plattformen lädt Gradle nach.
      - uses: gradle/actions/setup-gradle@v6

      # Signiert wird mit dem Schlüssel aus dem Secret KEYSTORE_BASE64, damit jede neue APK sich über
      # die alte installiert. Fehlt das Secret, entsteht ein einmaliger Schlüssel nur für diesen Lauf.
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          KS="$RUNNER_TEMP/release.keystore"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$KS"
          else
            echo "::warning::Secret KEYSTORE_BASE64 fehlt, diese APK bekommt einen einmaligen Schlüssel."
            keytool -genkeypair -keystore "$KS" -storepass android -keypass android -alias sideload \
              -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Flutlicht"
          fi
          echo "KEYSTORE_FILE=$KS" >> "$GITHUB_ENV"

      - name: Build APK
        env:
          VERSION_NAME: 1.0.${{ github.run_number }}
          KEYSTORE_PASSWORD: android
          KEY_ALIAS: sideload
          KEY_PASSWORD: android
        run: |
          export VERSION_CODE=$((10000 + GITHUB_RUN_NUMBER))
          chmod +x ./gradlew
          ./gradlew assembleStandardRelease --stacktrace
          mkdir -p dist
          cp "$(ls app/build/outputs/apk/standard/release/*.apk | head -n1)" dist/Flutlicht.apk
          cp dist/Flutlicht.apk "dist/Flutlicht-v1.0.${GITHUB_RUN_NUMBER}.apk"

      - uses: actions/upload-artifact@v7
        with:
          name: Flutlicht
          path: dist/Flutlicht.apk
          if-no-files-found: error

      # Ein Release behält seinen Tag; damit "latest" zum gebauten Stand passt, wird der Tag mitgezogen.
      - name: Move tag "latest"
        run: |
          git tag -f latest "$GITHUB_SHA"
          git push -f origin refs/tags/latest

      - name: Publish "latest" release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          name: Neueste Version
          prerelease: true
          make_latest: false
          body: "Automatisch gebaut aus ${{ github.ref_name }} @ ${{ github.sha }} (Version 1.0.${{ github.run_number }})"
          files: dist/Flutlicht.apk

      - name: Publish versioned release for the in-app updater
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Flutlicht 1.0.${{ github.run_number }}
          make_latest: true
          body: "Automatisch gebaut aus ${{ github.ref_name }} @ ${{ github.sha }}"
          files: dist/Flutlicht-v1.0.${{ github.run_number }}.apk
